name: tests

# Runs on every push and pull request: build the standalone indus driver (MPI + OpenMP)
# and run its ctest suite. PLUMED and GROMACS are not built here; the PLUMED-driver tests
# (plumed_patch/test/run_tests.sh) and the MD smoke test are run by
# scripts/install/install_indus_stack.sh.

on:
  push:
  pull_request:

jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and OpenMPI
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopenmpi-dev openmpi-bin

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=mpicc -DCMAKE_CXX_COMPILER=mpicxx \
            -DMPI_ENABLED=ON -DOPENMP_ENABLED=ON -DGPTL_ENABLED=OFF

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Run regression tests
        # the MPI tests use 4 ranks x 2 threads; allow that on small runners
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: cd build && ctest --output-on-failure
